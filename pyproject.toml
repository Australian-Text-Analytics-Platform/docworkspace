[project]
name = "docworkspace"
version = "0.2.2"
description = "A workspace library for managing Polars dataframes with parent-child relationships and lazy evaluation"
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["polars-text>=0.1.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8.0.0"]
